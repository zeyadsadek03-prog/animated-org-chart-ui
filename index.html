<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Lineage — Family Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F0E3;
    --dot: rgba(64,55,36,0.20);
    --ink:#26302A;
    --ink-soft:#767061;
    --accent:#A8791C;
    --accent-dark:#7E5A12;
    --accent-soft: rgba(168,121,28,0.14);
    --accent-line: rgba(168,121,28,0.85);
    --card-bg:#FFFDF7;
    --shadow: 0 10px 24px rgba(38,48,42,0.10), 0 2px 6px rgba(38,48,42,0.07);
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    background:var(--paper);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- background dot grid (parallax) ---------- */
  #bg-grid{
    position:fixed;
    inset:-60% -60%;
    background-image: radial-gradient(var(--dot) 1.4px, transparent 1.4px);
    background-size: 26px 26px;
    will-change: transform;
    pointer-events:none;
  }
  #bg-vignette{
    position:fixed; inset:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(245,240,227,0) 40%, rgba(245,240,227,0.9) 100%);
  }

  /* ---------- viewport / canvas ---------- */
  #viewport{
    position:fixed; inset:0;
    overflow:hidden;
    cursor:grab;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  #viewport.grabbing{ cursor:grabbing; }

  #canvas{
    position:absolute;
    left:0; top:0;
    width:0; height:0;
    will-change: transform;
  }

  #edges{
    position:absolute; left:0; top:0;
    overflow:visible;
    pointer-events:none;
  }
  #edges path{
    fill:none;
    stroke:var(--accent-line);
    stroke-width:2;
    stroke-linecap:round;
  }

  #nodes-layer{
    position:absolute; left:0; top:0;
  }

  /* ---------- node card ---------- */
  .node{
    position:absolute;
    left:0; top:0;
    width:120px;
    display:none;
    opacity:0;
    transition: opacity .32s ease;
    will-change: transform;
  }
  .node.is-visible{ opacity:1; }

  .node .hit{
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
  }

  .avatar{
    position:relative;
    width:68px; height:68px;
    border-radius:50%;
    background: var(--card-bg);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:24px;
    color: var(--ink);
    box-shadow: var(--shadow);
    transition: box-shadow .18s ease;
  }
  .node[data-depth="0"] .avatar{
    background: linear-gradient(180deg, var(--accent-soft), var(--card-bg) 70%);
  }
  .avatar.has-photo{
    background: transparent;
    box-shadow: none;
  }
  /* dashed ring lives on its own rotating pseudo-element so the
     initials/text inside the avatar stay upright */
  .avatar::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:50%;
    border: 2.4px dashed rgba(168,121,28,0.6);
    animation: ring-spin 12s linear infinite;
    pointer-events:none;
  }
  .node[data-depth="0"] .avatar::before{
    border-color: rgba(168,121,28,0.85);
  }
  .node .hit:hover .avatar::before{
    border-color: var(--accent-dark);
  }
  @keyframes ring-spin{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .avatar::before{ animation:none; }
  }
  .node .hit:hover .avatar{
    transform: translateY(-2px);
    box-shadow: 0 14px 26px rgba(38,48,42,0.14), 0 3px 8px rgba(38,48,42,0.08);
  }
  .node .hit:active .avatar{ transform: translateY(0px) scale(.97); }

  /* photo avatars: sit inset from the dashed ring so a small gap of
     paper-colored background shows between the portrait and the border */
  .avatar-photo{
    position:absolute;
    top:4px; right:4px; bottom:4px; left:4px;
    width:calc(100% - 8px); height:calc(100% - 8px);
    border-radius:50%;
    object-fit:cover;
    display:block;
    box-shadow: 0 1px 3px rgba(38,48,42,0.18) inset;
  }

  .badge{
    position:absolute;
    right:-2px; bottom:-2px;
    width:22px; height:22px;
    border-radius:50%;
    background:#fff;
    border:1.5px solid var(--accent);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 2px 6px rgba(38,48,42,0.15);
  }
  .badge svg{
    width:11px; height:11px;
    transition: transform .3s ease;
  }
  .node.expanded .badge svg{ transform: rotate(180deg); }
  .badge path{ stroke:var(--accent); stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }

  .pill{
    margin-top:9px;
    padding:6px 14px;
    border-radius:999px;
    background: var(--accent);
    color:#FFF7E9;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:.2px;
    white-space:nowrap;
    box-shadow: 0 4px 10px rgba(126,90,18,0.28);
  }

  /* ---------- chrome ---------- */
  #topbar{
    position:fixed; top:0; left:0; right:0;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:22px 26px;
    pointer-events:none;
    z-index:5;
  }
  .eyebrow{
    font-size:11px; letter-spacing:2.2px; text-transform:uppercase;
    color:var(--accent-dark); font-weight:600; margin:0 0 4px 0;
  }
  #topbar h1{
    margin:0; font-family:'Fraunces', serif; font-weight:600;
    font-size:22px; color:var(--ink);
  }
  #topbar p{
    margin:4px 0 0 0; font-size:13px; color:var(--ink-soft); max-width:280px;
  }

  #recenter{
    pointer-events:auto;
    display:flex; align-items:center; gap:7px;
    background: var(--card-bg);
    border:1.5px solid var(--accent);
    color:var(--accent-dark);
    font-family:'Inter',sans-serif;
    font-weight:600; font-size:12.5px;
    padding:9px 15px;
    border-radius:999px;
    cursor:pointer;
    box-shadow: var(--shadow);
    transition: transform .15s ease, background .15s ease;
  }
  #recenter:hover{ background:var(--accent-soft); }
  #recenter:active{ transform: scale(.96); }
  #recenter svg{ width:13px; height:13px; }
  #recenter svg path{ stroke:var(--accent-dark); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }

  #zoom-controls{
    position:fixed;
    right:18px; bottom:24px;
    z-index:5;
    display:flex; flex-direction:column;
    background: var(--card-bg);
    border:1.5px solid var(--accent);
    border-radius:14px;
    box-shadow: var(--shadow);
    overflow:hidden;
  }
  #zoom-controls button{
    -webkit-appearance:none; appearance:none;
    border:none; background:transparent;
    width:42px; height:42px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--accent-dark);
    font-family:'Inter',sans-serif;
    font-size:19px; font-weight:600;
    line-height:1;
    transition: background .15s ease;
  }
  #zoom-controls button:active{ background: var(--accent-soft); }
  #zoom-controls #zoom-in{ border-bottom:1px solid rgba(168,121,28,0.35); }

  @media (max-width:600px){
    #topbar{ padding:16px 16px; }
    #topbar h1{ font-size:18px; }
    #topbar p{ display:none; }
    #recenter span{ display:none; }
    #recenter{ padding:10px; }
    #zoom-controls{ right:14px; bottom:18px; }
    #zoom-controls button{ width:44px; height:44px; }
  }

  @media (prefers-reduced-motion: reduce){
    .node{ transition:none; }
  }
</style>
</head>
<body>

  <div id="bg-grid"></div>
  <div id="bg-vignette"></div>

  <div id="topbar">
    <div>
      <p class="eyebrow">Lineage</p>
      <h1>The Kara Family</h1>
      <p>Tap any circle to open or close their branch. Drag to pan around.</p>
    </div>
    <button id="recenter" title="Recenter on root">
      <svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
      <span>Recenter</span>
    </button>
  </div>

  <div id="viewport">
    <div id="canvas">
      <svg id="edges" width="1" height="1"><g id="edges-g"></g></svg>
      <div id="nodes-layer"></div>
    </div>
  </div>

  <div id="zoom-controls">
    <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
    <button id="zoom-out" title="Zoom out" aria-label="Zoom out">&minus;</button>
  </div>

    if (raw.children && raw.children.length){
      node.children = raw.children.map(c => buildTree(c, node, depth + 1));
    }
    if (raw.spouse){
      const spouseNode = {
        _uid: 'n' + (idCounter++),
        id: raw.spouse.id,
        name: raw.spouse.name,
        gender: node.gender === 'f' ? 'm' : 'f',
        parent: node,
        depth,
        children: [],
        expanded: false,
        visible: false,
        el: null,
        curX: 0, curY: 0,
        targetX: 0, targetY: 0,
        _w: LEAF_W,
        tween: null,
        spouse: null,
        ownerNode: node,
        isSpouse: true
      };
      nodeMap.set(spouseNode.id, spouseNode);
      node.spouse = spouseNode;
    }
    nodeMap.set(node.id, node);
    return node;
  }
  const root = buildTree(treeData, null, 0);
  const allNodes = Array.from(nodeMap.values());

  /* husband is always the branch point kids expand from: the blood-line
     node itself if he's male, otherwise his (male) spouse */
  function husbandOf(node){
    if (!node.spouse) return node;
    return node.gender === 'f' ? node.spouse : node;
  }
  /* clicking resolves to a toggle only when the clicked element IS the
     husband anchor for its family unit; otherwise it's inert */
  function resolveToggleNode(clicked){
    return clicked.ownerNode || clicked;
  }

  /* ---------------- DOM refs ---------------- */
  const viewport = document.getElementById('viewport');
  const canvas = document.getElementById('canvas');
  const nodesLayer = document.getElementById('nodes-layer');
  const edgesG = document.getElementById('edges-g');
  const bgGrid = document.getElementById('bg-grid');
  const recenterBtn = document.getElementById('recenter');
  const zoomInBtn = document.getElementById('zoom-in');
  const zoomOutBtn = document.getElementById('zoom-out');

  /* ---------------- create node elements ---------------- */
  function initial(name){ return name.charAt(0).toUpperCase(); }

  function createNodeEl(node){
    const el = document.createElement('div');
    el.className = 'node';
    el.dataset.id = node.id;
    el.dataset.depth = node.depth;

    const hit = document.createElement('div');
    hit.className = 'hit';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    const photoSrc = (typeof nodePhotos !== 'undefined') ? nodePhotos[node.id] : null;
    if (photoSrc){
      avatar.classList.add('has-photo');
      const img = document.createElement('img');
      img.className = 'avatar-photo';
      img.src = photoSrc;
      img.alt = node.name;
      avatar.appendChild(img);
    } else {
      avatar.textContent = initial(node.name);
    }

    const pill = document.createElement('div');
    pill.className = 'pill';
    pill.textContent = node.name;

    hit.appendChild(avatar);
    hit.appendChild(pill);
    el.appendChild(hit);
    nodesLayer.appendChild(el);
    node.el = el;
    node.avatarEl = avatar;
  }
  allNodes.forEach(createNodeEl);

  /* badge (expand chevron) lives on the blood-line child's own avatar,
     regardless of who the connector line is anchored to */
  allNodes.forEach(node => {
    if (!node.children.length) return;
    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
    node.avatarEl.appendChild(badge);
  });

  /* ---------------- edges ---------------- */
  const activeEdges = new Map(); // childId -> {parent, child, pathEl}

  function getOrCreatePath(childId){
    let p = document.createElementNS('http://www.w3.org/2000/svg','path');
    edgesG.appendChild(p);
    return p;
  }
  // Draws the connector from parent to child (stroke animates in), used when
  // a child is first revealed. Both endpoints are already at their final,
  // stationary position — only the line's reveal is animated.
  function addEdgeDrawn(node, duration, onDrawComplete){
    const pathEl = getOrCreatePath(node.id);
    activeEdges.set(node.id, { type:'parent-child', parent: node.parent, child: node, pathEl });

    const p = node.parent;
    const branch = husbandOf(p);
    const x1 = branch.curX, y1 = branch.curY + PARENT_BOTTOM_OFFSET;
    const x2 = node.curX, y2 = node.curY - CHILD_TOP_OFFSET;
    pathEl.setAttribute('d', edgePath(x1,y1,x2,y2));

    const len = pathEl.getTotalLength() || 1;
    pathEl.style.transition = 'none';
    pathEl.style.strokeDasharray = String(len);
    pathEl.style.strokeDashoffset = String(len);
    // force reflow so the "none" transition + starting offset are committed
    // before we switch to the animated end state
    pathEl.getBoundingClientRect();
    pathEl.style.transition = `stroke-dashoffset ${duration}ms ease`;
    requestAnimationFrame(() => { pathEl.style.strokeDashoffset = '0'; });

    window.setTimeout(() => {
      pathEl.style.strokeDasharray = '';
      pathEl.style.strokeDashoffset = '';
      pathEl.style.transition = '';
      if (onDrawComplete) onDrawComplete();
    }, duration);
  }

  // Straight horizontal connector between a node and its spouse. Same
  // dash-reveal technique as addEdgeDrawn, but a straight line, not a curve.
  function addSpouseEdgeDrawn(node, spouse, duration, onDrawComplete){
    const pathEl = getOrCreatePath(spouse.id);
    activeEdges.set(spouse.id, { type:'spouse', a: node, b: spouse, pathEl });

    const x1 = node.curX + AVATAR_R, y1 = node.curY;
    const x2 = spouse.curX - AVATAR_R, y2 = spouse.curY;
    pathEl.setAttribute('d', `M ${x1} ${y1} L ${x2} ${y2}`);

    const len = pathEl.getTotalLength() || 1;
    pathEl.style.transition = 'none';
    pathEl.style.strokeDasharray = String(len);
    pathEl.style.strokeDashoffset = String(len);
    pathEl.getBoundingClientRect();
    pathEl.style.transition = `stroke-dashoffset ${duration}ms ease`;
    requestAnimationFrame(() => { pathEl.style.strokeDashoffset = '0'; });

    window.setTimeout(() => {
      pathEl.style.strokeDasharray = '';
      pathEl.style.strokeDashoffset = '';
      pathEl.style.transition = '';
      if (onDrawComplete) onDrawComplete();
    }, duration);
  }

  // Reverse of addEdgeDrawn: retracts an already-drawn connector back to
  // nothing. Used on collapse, after the child node has finished fading out.
  function retractEdge(node, duration, onRetractComplete){
    const edge = activeEdges.get(node.id);
    if (!edge){ if (onRetractComplete) onRetractComplete(); return; }
    const pathEl = edge.pathEl;
    const len = pathEl.getTotalLength() || 1;
    pathEl.style.transition = 'none';
    pathEl.style.strokeDasharray = String(len);
    pathEl.style.strokeDashoffset = '0';
    pathEl.getBoundingClientRect();
    pathEl.style.transition = `stroke-dashoffset ${duration}ms ease`;
    requestAnimationFrame(() => { pathEl.style.strokeDashoffset = String(len); });

    window.setTimeout(() => {
      if (onRetractComplete) onRetractComplete();
    }, duration);
  }
  function removeEdge(nodeId){
    const e = activeEdges.get(nodeId);
    if (e){ e.pathEl.remove(); activeEdges.delete(nodeId); }
  }

  function edgePath(x1,y1,x2,y2){
    const midY = (y1 + y2) / 2;
    return `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
  }

  function updateConnectors(){
    activeEdges.forEach(edge => {
      if (edge.type === 'spouse'){
        const x1 = edge.a.curX + AVATAR_R, y1 = edge.a.curY;
        const x2 = edge.b.curX - AVATAR_R, y2 = edge.b.curY;
        edge.pathEl.setAttribute('d', `M ${x1} ${y1} L ${x2} ${y2}`);
      } else {
        const p = edge.parent, c = edge.child;
        const branch = husbandOf(p);
        const x1 = branch.curX, y1 = branch.curY + PARENT_BOTTOM_OFFSET;
        const x2 = c.curX, y2 = c.curY - CHILD_TOP_OFFSET;
        edge.pathEl.setAttribute('d', edgePath(x1,y1,x2,y2));
      }
    });
  }

  /* ---------------- layout ---------------- */
  function measure(node){
    let w;
    if (!node.expanded || node.children.length === 0){
      w = LEAF_W;
    } else {
      w = 0;
      for (const c of node.children) w += measure(c);
    }
    if (node.expanded && node.spouse){
      // node.targetX ends up ~w/2 from its own left edge (it's centered
      // above its children); the spouse sits just to the right of that
      // center, so only widen the band if the spouse would poke past it.
      const relCenter = w / 2;
      const spouseRightEdge = relCenter + AVATAR_R + SPOUSE_GAP + SPOUSE_W;
      w = Math.max(w, spouseRightEdge);
    }
    node._w = w;
    return w;
  }
  function place(node, left, depth){
    node.targetY = TOP_MARGIN + depth * LEVEL_H;
    let childrenW;
    if (!node.expanded || node.children.length === 0){
      childrenW = LEAF_W;
      node.targetX = left + LEAF_W / 2;
    } else {
      let cur = left;
      for (const c of node.children){ place(c, cur, depth + 1); cur += c._w; }
      childrenW = cur - left;
      const first = node.children[0], last = node.children[node.children.length - 1];
      node.targetX = (first.targetX + last.targetX) / 2;
    }
    if (node.spouse){
      if (node.expanded){
        // anchor to this node's own center, not the children band's edge
        node.spouse.targetY = node.targetY;
        node.spouse.targetX = node.targetX + AVATAR_R + SPOUSE_GAP + SPOUSE_W / 2;
      } else {
        node.spouse.targetX = node.targetX;
        node.spouse.targetY = node.targetY;
      }
    }
  }
  function relayout(){
    measure(root);
    place(root, -root._w / 2, 0);
  }

  /* ---------------- transform application ---------------- */
  function applyTransform(node){
    node.el.style.transform = `translate(${node.curX - CARD_HALF_W}px, ${node.curY - AVATAR_R}px)`;
  }

  /* ---------------- reveal / hide ---------------- */
  function showNode(node){
    node.visible = true;
    node.el.style.display = 'block';
    // Children no longer spread out from the parent — they sit at their
    // final position from the start, hidden, and only the connector +
    // opacity are animated.
    node.curX = node.targetX; node.curY = node.targetY;
    applyTransform(node);

    addEdgeDrawn(node, EXPAND_MS, () => {
      node.el.classList.add('is-visible');
      if (node.expanded){
        if (node.spouse){
          showSpouse(node);
        } else if (node.children.length){
          revealChildren(node);
        }
      }
    });
  }
  function revealChildren(node){
    for (const child of node.children){
      if (!child.visible) showNode(child);
    }
  }

  function hideDescendantsInstant(node){
    for (const child of node.children){
      if (child.visible){
        child.visible = false;
        child.el.style.display = 'none';
        child.el.classList.remove('is-visible');
        child.tween = null;
        removeEdge(child.id);
      }
      if (child.spouse && child.spouse.visible){
        const s = child.spouse;
        s.visible = false;
        s.el.style.display = 'none';
        s.el.classList.remove('is-visible');
        s.tween = null;
        removeEdge(s.id);
      }
      hideDescendantsInstant(child);
    }
  }
  function hideNode(node){
    if (!node.visible) return;
    node.visible = false;
    node.tween = null; // children no longer move on collapse, nothing to tween
    node.el.classList.remove('is-visible'); // starts the CSS opacity fade-out
    if (node.spouse) hideSpouse(node);
    hideDescendantsInstant(node);

    window.setTimeout(() => {
      retractEdge(node, COLLAPSE_MS, () => {
        node.el.style.display = 'none';
        removeEdge(node.id);
      });
    }, FADE_MS);
  }
  function hideChildren(node){
    for (const child of node.children){
      hideNode(child);
    }
  }

  function reflowVisible(){
    for (const node of allNodes){
      if (node.visible && node.tween === null){
        if (node.curX !== node.targetX || node.curY !== node.targetY){
          node.tween = {
            start: performance.now(),
            duration: EXPAND_MS,
            fromX: node.curX, fromY: node.curY,
            toX: node.targetX, toY: node.targetY,
            onComplete: null
          };
        }
      }
    }
  }

  /* ---------------- spouse reveal / hide ---------------- */
  // Fade in first, THEN draw the connecting line — reverse of the
  // parent-child pattern (which draws the line first, then fades the node).
  function showSpouse(node){
    const spouse = node.spouse;
    if (!spouse || spouse.visible) return;
    spouse.visible = true;
    spouse.el.style.display = 'block';
    spouse.curX = spouse.targetX; spouse.curY = spouse.targetY;
    applyTransform(spouse);
    spouse.el.offsetHeight; // force reflow so the display->opacity transition isn't coalesced away
    requestAnimationFrame(() => spouse.el.classList.add('is-visible'));
    window.setTimeout(() => {
      addSpouseEdgeDrawn(node, spouse, EXPAND_MS, () => {
        // expansion + children fade in, same pattern as any other node
        revealChildren(node);
      });
    }, FADE_MS);
  }
  function hideSpouse(node){
    const spouse = node.spouse;
    if (!spouse || !spouse.visible) return;
    spouse.visible = false;
    spouse.tween = null;
    spouse.el.classList.remove('is-visible');
    window.setTimeout(() => {
      retractEdge(spouse, COLLAPSE_MS, () => {
        spouse.el.style.display = 'none';
        removeEdge(spouse.id);
      });
    }, FADE_MS);
  }

  /* ---------------- toggle ---------------- */
  function toggle(node){
    if (!node.children.length && !node.spouse) return;
    node.expanded = !node.expanded;
    node.el.classList.toggle('expanded', node.expanded);
    relayout();
    if (node.expanded){
      // frame the parent, spouse (if any), and all direct children so
      // nothing gets stranded off-screen on narrow viewports
      focusOnNodes([node, ...(node.spouse ? [node.spouse] : []), ...node.children], FOCUS_MS);

      if (node.spouse){
        // 1. align: reflow already-visible nodes into their new slots
        reflowVisible();
        // 2. spouse fades in -> 3. spouse link draws -> 4. expansion -> 5. children fade in
        window.setTimeout(() => showSpouse(node), EXPAND_MS);
      } else {
        revealChildren(node);
        reflowVisible();
      }
    } else {
      if (node.spouse) hideSpouse(node);
      hideChildren(node);
      // Pull focus back out to the level this node lives in — its parent
      // plus siblings — instead of zooming tight on just this node.
      // Falls back to the whole visible tree when collapsing the root.
      if (node.parent){
        focusOnNodes([node.parent, ...node.parent.children], FOCUS_MS);
      } else {
        focusOnNodes(allNodes.filter(n => n.visible), FOCUS_MS);
      }
      reflowVisible();
    }
  }

  /* ---------------- animation loop ---------------- */
  function ease(t){ return 1 - Math.pow(1 - t, 3); }
  function lerp(a,b,t){ return a + (b - a) * t; }

  function tick(now){
    for (const node of allNodes){
      if (node.tween){
        const tw = node.tween;
        const t = Math.min(1, (now - tw.start) / tw.duration);
        const e = ease(t);
        node.curX = lerp(tw.fromX, tw.toX, e);
        node.curY = lerp(tw.fromY, tw.toY, e);
        applyTransform(node);
        if (t >= 1){
          node.tween = null;
          const cb = tw.onComplete;
          if (cb) cb();
        }
      }
    }
    updateConnectors();
    requestAnimationFrame(tick);
  }

  /* ---------------- pan / zoom state ---------------- */
  let panX = 0, panY = 0, scale = 1;
  let isPanning = false, moved = false;
  let startPointer = {x:0,y:0}, startPan = {x:0,y:0};
  let startTarget = null;
  const DRAG_THRESHOLD = 6;

  // any in-flight camera tween (pan/zoom) — pointer/wheel/button interaction
  // always cancels this so the user's input wins
  let camTween = null;

  function setTransform(x, y, s){
    panX = x; panY = y; scale = s;
    canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    bgGrid.style.transform = `translate(${panX * 0.45}px, ${panY * 0.45}px)`;
  }
  // back-compat alias used by drag handling below (keeps current scale)
  function setPan(x, y){ setTransform(x, y, scale); }

  function animateCamera(toX, toY, toS, duration, onDone){
    camTween = null;
    const fromX = panX, fromY = panY, fromS = scale;
    const start = performance.now();
    const dur = REDUCED ? 1 : duration;
    const tweenId = {};
    camTween = tweenId;
    function step(now){
      if (camTween !== tweenId) return; // superseded by newer interaction
      const t = Math.min(1, (now - start) / dur);
      const e = ease(t);
      setTransform(lerp(fromX, toX, e), lerp(fromY, toY, e), lerp(fromS, toS, e));
      if (t < 1){
        requestAnimationFrame(step);
      } else {
        camTween = null;
        if (onDone) onDone();
      }
    }
    requestAnimationFrame(step);
  }

  /* ---------------- auto-focus (fit a group of nodes on screen) --------- */
  function focusOnNodes(nodes, duration){
    if (!nodes.length) return;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const n of nodes){
      minX = Math.min(minX, n.targetX); maxX = Math.max(maxX, n.targetX);
      minY = Math.min(minY, n.targetY); maxY = Math.max(maxY, n.targetY);
    }
    minX -= FOCUS_PAD_X; maxX += FOCUS_PAD_X;
    minY -= FOCUS_PAD_TOP; maxY += FOCUS_PAD_BOTTOM;

    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const groupW = Math.max(1, maxX - minX);
    const groupH = Math.max(1, maxY - minY);
    const fitScale = Math.min(vw / groupW, vh / groupH);
    const targetScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, fitScale));

    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const targetPanX = vw / 2 - targetScale * cx;
    const targetPanY = vh / 2 - targetScale * cy;

    animateCamera(targetPanX, targetPanY, targetScale, duration);
  }

  /* ---------------- manual zoom (buttons / wheel / pinch) --------------- */
  function zoomAround(screenX, screenY, newScale, animated){
    newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
    // keep the canvas point currently under (screenX,screenY) fixed on screen
    const targetPanX = screenX - (newScale / scale) * (screenX - panX);
    const targetPanY = screenY - (newScale / scale) * (screenY - panY);
    if (animated){
      animateCamera(targetPanX, targetPanY, newScale, 220);
    } else {
      camTween = null;
      setTransform(targetPanX, targetPanY, newScale);
    }
  }

  zoomInBtn.addEventListener('click', () => {
    zoomAround(viewport.clientWidth / 2, viewport.clientHeight / 2, scale * ZOOM_STEP, true);
  });
  zoomOutBtn.addEventListener('click', () => {
    zoomAround(viewport.clientWidth / 2, viewport.clientHeight / 2, scale / ZOOM_STEP, true);
  });

  // desktop trackpad / mouse wheel zoom, anchored under the cursor
  viewport.addEventListener('wheel', e => {
    e.preventDefault();
    camTween = null;
    const rect = viewport.getBoundingClientRect();
    const factor = Math.exp(-e.deltaY * 0.0016);
    zoomAround(e.clientX - rect.left, e.clientY - rect.top, scale * factor, false);
  }, { passive:false });

  /* ---------------- pan / pinch (pointer events) ---------------- */
  const activePointers = new Map(); // pointerId -> {x,y}
  let pinching = false;
  let pinchStartDist = 1, pinchStartScale = 1;
  let pinchAnchor = {x:0,y:0}; // screen-space anchor point, held fixed while pinching

  function pointerDist(){
    const pts = Array.from(activePointers.values());
    return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  }
  function pointerMid(){
    const pts = Array.from(activePointers.values());
    return { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
  }

  viewport.addEventListener('pointerdown', e => {
    viewport.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    camTween = null;

    if (activePointers.size === 2){
      // entering pinch mode — stop treating this as a tap/drag
      isPanning = false;
      pinching = true;
      pinchStartDist = pointerDist();
      pinchStartScale = scale;
      const rect = viewport.getBoundingClientRect();
      const mid = pointerMid();
      pinchAnchor = { x: mid.x - rect.left, y: mid.y - rect.top };
      startTarget = null;
      return;
    }

    isPanning = true; moved = false;
    startPointer = { x: e.clientX, y: e.clientY };
    startPan = { x: panX, y: panY };
    // Capture the real element under the pointer now — once we call
    // setPointerCapture above, e.target on later events (pointerup) gets
    // retargeted to the capturing element itself, so it can't be used
    // to find which node (if any) was tapped.
    startTarget = e.target;
    viewport.classList.add('grabbing');
  });

  viewport.addEventListener('pointermove', e => {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pinching && activePointers.size >= 2){
      const dist = pointerDist();
      const newScale = pinchStartScale * (dist / pinchStartDist);
      zoomAround(pinchAnchor.x, pinchAnchor.y, newScale, false);
      return;
    }

    if (!isPanning) return;
    const dx = e.clientX - startPointer.x, dy = e.clientY - startPointer.y;
    if (!moved && Math.hypot(dx,dy) > DRAG_THRESHOLD) moved = true;
    if (moved) setPan(startPan.x + dx, startPan.y + dy);
  });

  function endPan(e){
    activePointers.delete(e.pointerId);

    if (pinching){
      if (activePointers.size < 2){
        pinching = false;
        // resume single-finger panning smoothly from here, if a pointer remains
        const remaining = Array.from(activePointers.values())[0];
        if (remaining){
          isPanning = true; moved = true;
          startPointer = { x: remaining.x, y: remaining.y };
          startPan = { x: panX, y: panY };
        }
      }
      return;
    }

    if (!isPanning) return;
    isPanning = false;
    viewport.classList.remove('grabbing');
    if (!moved && startTarget){
      const nodeEl = startTarget.closest && startTarget.closest('.node');
      if (nodeEl){
        const node = nodeMap.get(nodeEl.dataset.id);
        if (node){
          const toggleTarget = resolveToggleNode(node);
          if (toggleTarget) toggle(toggleTarget);
        }
      }
    }
    startTarget = null;
  }
  viewport.addEventListener('pointerup', endPan);
  viewport.addEventListener('pointercancel', endPan);
  viewport.addEventListener('lostpointercapture', e => {
    activePointers.delete(e.pointerId);
    if (activePointers.size < 2) pinching = false;
    isPanning = false;
    viewport.classList.remove('grabbing');
  });

  /* ---------------- recenter ---------------- */
  function centerOnRoot(animated){
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const targetPanX = vw / 2 - root.curX;
    const targetPanY = vh * 0.34 - root.curY;
    if (!animated){ setTransform(targetPanX, targetPanY, 1); return; }
    camTween = null;
    animateCamera(targetPanX, targetPanY, 1, 480);
  }
  recenterBtn.addEventListener('click', () => centerOnRoot(true));

  /* ---------------- init ---------------- */
  relayout();
  root.curX = root.targetX; root.curY = root.targetY;
  root.visible = true;
  root.el.style.display = 'block';
  applyTransform(root);
  requestAnimationFrame(() => root.el.classList.add('is-visible'));

  centerOnRoot(false);
  requestAnimationFrame(tick);

  window.addEventListener('resize', () => {
    // keep root anchored roughly if user hasn't panned much; harmless no-op otherwise
  });

})();
</script>
</body>
</html>
